name: Audit music video chart presence
on:
  workflow_dispatch:
    inputs:
      video_id:
        description: YouTube video ID to check before title filtering
        required: true
        default: fEw6VZq9xg8
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit raw genre metadata across entire music pool
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {classifyGenres} from './music-genres.mjs';
          const catalog=JSON.parse(readFileSync('music-catalog.json','utf8')),ids=[...new Set(catalog.tracks.map(t=>t.id))],items=[];
          if(ids.length>11000)throw Error('Audit budget exceeded');
          for(let i=0;i<ids.length;i+=50){
           const url=new URL('https://www.googleapis.com/youtube/v3/videos');
           for(const [k,v] of Object.entries({part:'snippet,topicDetails',id:ids.slice(i,i+50).join(','),key:process.env.YOUTUBE_API_KEY}))url.searchParams.set(k,v);
           let r,d;try{r=await fetch(url,{signal:AbortSignal.timeout(15000)});d=await r.json()}catch{throw Error('Metadata request failed')}
           if(!r.ok||!Array.isArray(d.items))throw Error('YouTube metadata HTTP '+r.status);
           items.push(...d.items);
          }
          const topics=new Map(),unknownTags=new Map(),details=[];
          const explicit=item=>{
           const tags=[...(item.snippet?.tags||[])];
           for(const txt of [item.snippet?.title||'',item.snippet?.description||'']){
            for(const m of txt.matchAll(/#([\p{L}\p{N}_-]+)/gu))tags.push(m[1]);
            for(const m of txt.matchAll(/(?:^|\n)\s*(?:genre|genres|장르)\s*:\s*([^\n]+)/gi))tags.push(...m[1].split(/[,;|]/));
           }
           return [...new Set(tags)];
          };
          for(const item of items){
           const current=classifyGenres(item),unclassified=current.genres.includes('unclassified');
           const urls=item.topicDetails?.topicCategories||[];
           for(const url of urls){
            const single=classifyGenres({topicDetails:{topicCategories:[url]}});
            if(!topics.has(url))topics.set(url,{url,recognized:!single.genres.includes('unclassified'),count:0,unclassifiedCount:0,ids:[]});
            const row=topics.get(url);row.count++;if(unclassified)row.unclassifiedCount++;row.ids.push(item.id);
           }
           for(const tag of explicit(item)){
            const c=classifyGenres({snippet:{tags:[tag]}});
            if(c.genres.includes('unclassified')){
             const label=tag.normalize('NFKC').toLowerCase().replace(/[-_]/g,' ').replace(/\s+/g,' ').trim();
             if(!unknownTags.has(label))unknownTags.set(label,{tag,count:0,unclassifiedCount:0,ids:[]});
             const row=unknownTags.get(label);row.count++;if(unclassified)row.unclassifiedCount++;row.ids.push(item.id);
            }
           }
           const latin=urls.includes('https://en.wikipedia.org/wiki/Music_of_Latin_America');
           details.push({id:item.id,title:item.snippet.title,channel:item.snippet.channelTitle,topics:urls,tags:explicit(item),currentGenres:current.genres,genreEvidence:current.genreEvidence,latinTopic:latin,proposedGenres:latin?[...new Set([...current.genres.filter(g=>g!=='unclassified'),'latin'])]:current.genres});
          }
          const missingGenreTag=/\b(pop|rap|hip.?hop|r.?b|soul|rock|metal|dance|electro|edm|house|techno|trance|reggae|afro|amapiano|country|folk|jazz|blues|classical|latin|salsa|bachata|cumbia|corrid|norte|banda|mexican|regional|reggaeton|funk|disco|punk|indie|trap|drill|kpop|jpop|cantopop|mandopop|gospel|christian|soundtrack|musica|música|musique)\b|힙합|팝|발라드|트로트/i;
          const summary={checkedAt:new Date().toISOString(),catalogGeneratedAt:catalog.generatedAt,requested:ids.length,returned:items.length,missingIds:ids.filter(id=>!items.some(t=>t.id===id)),requests:Math.ceil(ids.length/50),classified:details.filter(t=>!t.currentGenres.includes('unclassified')).length,unclassified:details.filter(t=>t.currentGenres.includes('unclassified')).length,latinMappingOnly:{newlyClassified:details.filter(t=>t.latinTopic&&t.currentGenres.includes('unclassified')).length,existingClassifiedAddLatin:details.filter(t=>t.latinTopic&&!t.currentGenres.includes('unclassified')&&!t.currentGenres.includes('latin')).length,newlyClassifiedUS:details.filter(t=>t.latinTopic&&t.currentGenres.includes('unclassified')&&catalog.tracks.find(c=>c.id===t.id)?.chartCountries?.includes('US')).length},topics:[...topics.values()].sort((a,b)=>b.count-a.count),candidateUnrecognizedTags:[...unknownTags.values()].filter(t=>missingGenreTag.test(t.tag)).sort((a,b)=>b.unclassifiedCount-a.unclassifiedCount||b.count-a.count),unclassifiedExamples:details.filter(t=>t.currentGenres.includes('unclassified')).slice(0,12)};
          const report={...summary,details,allUnrecognizedTags:[...unknownTags.values()]};
          writeFileSync('music-genre-pool-audit.json',JSON.stringify(report,null,2));
          writeFileSync('music-genre-pool-api-raw.json',JSON.stringify({checkedAt:summary.checkedAt,items},null,2));
          console.log('POOL_GENRE_AUDIT_JSON='+JSON.stringify(summary));
          NODE
      - name: Check raw regional music lists
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          VIDEO_ID: ${{ inputs.video_id }}
        run: |
          node --input-type=module <<'NODE'
          import {CHART_REGIONS} from './music-charts.mjs';
          import {musicVideo} from './music-core.mjs';
          import {writeFileSync} from 'node:fs';
          const id=process.env.VIDEO_ID,key=process.env.YOUTUBE_API_KEY;
          if(!/^[\w-]{11}$/.test(id)||!key)throw Error('Invalid video ID or missing credential');
          let requests=0;const checkedAt=new Date().toISOString(),matches=[],regions=[],usRaw=[];
          async function get(params){
            if(++requests>1+CHART_REGIONS.length*2)throw Error('Audit request limit reached');
            const url=new URL('https://www.googleapis.com/youtube/v3/videos');
            for(const [k,v] of Object.entries({...params,key}))url.searchParams.set(k,String(v));
            let r,d;try{r=await fetch(url,{signal:AbortSignal.timeout(15000)});d=await r.json()}catch{throw Error('YouTube API connection failed')}
            if(!r.ok){const raw=d.error?.errors?.[0]?.reason,reason=typeof raw==='string'&&/^[A-Za-z]+$/.test(raw)?raw:'unknown';const e=Error('YouTube HTTP '+r.status+' '+reason);e.status=r.status;throw e}
            if(!Array.isArray(d.items))throw Error('Invalid API items');return d;
          }
          const video=(await get({part:'snippet,contentDetails,statistics,status',id})).items[0];
          for(const region of CHART_REGIONS){
            try{
              let pageToken,offset=0,pages=0;
              for(let page=0;page<2;page++){
                const d=await get({part:'snippet,contentDetails,status',chart:'mostPopular',regionCode:region,videoCategoryId:10,maxResults:50,...(pageToken?{pageToken}:{})});pages++;
                if(region==='US')usRaw.push(...d.items.map((v,i)=>({position:offset+i+1,id:v.id,title:v.snippet.title,channel:v.snippet.channelTitle,publishedAt:v.snippet.publishedAt,duration:v.contentDetails.duration,embeddable:v.status.embeddable,titleAccepted:musicVideo(v.snippet.title)})));
                const index=d.items.findIndex(v=>v.id===id);if(index>=0)matches.push({region,position:offset+index+1});offset+=d.items.length;pageToken=d.nextPageToken;if(!pageToken)break;
              }
              regions.push({region,ok:true,videos:offset,pages});
            }catch(e){if([400,401,403,429].includes(e.status))throw e;regions.push({region,ok:false,error:e.message})}
          }
          const report={checkedAt,id,requests,configuredRegions:CHART_REGIONS.length,healthyRegions:regions.filter(r=>r.ok).length,matches,usRaw,video:video?{title:video.snippet.title,channelTitle:video.snippet.channelTitle,channelId:video.snippet.channelId,publishedAt:video.snippet.publishedAt,categoryId:video.snippet.categoryId,views:video.statistics.viewCount,duration:video.contentDetails.duration,embeddable:video.status.embeddable,titleAccepted:musicVideo(video.snippet.title),descriptionHasMV:/music video/i.test(video.snippet.description||'')}:null,regions,scope:'Raw YouTube mostPopular music lists, up to two pages per configured region; no title filtering or catalog changes.'};
          console.log('VIDEO_AUDIT_JSON='+JSON.stringify(report));
          writeFileSync('music-video-audit.json',JSON.stringify(report,null,2)+'\n');
          writeFileSync(process.env.GITHUB_STEP_SUMMARY,['# Music video chart presence','',video?.snippet.title||id,`Checked: ${checkedAt}`,`Regions checked: ${report.healthyRegions}/${CHART_REGIONS.length}`,`Matches before filtering: ${matches.length}`,'',...matches.map(m=>`- ${m.region}: position ${m.position}`)].join('\n'));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: music-video-audit
          path: |
            music-video-audit.json
            music-genre-pool-audit.json
            music-genre-pool-api-raw.json
          retention-days: 7


