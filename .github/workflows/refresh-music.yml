name: Refresh ELSEWHERE music
on:
  schedule:
    - cron: '43 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: catalog-refresh
  cancel-in-progress: false
jobs:
  collect-music:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check selection rules
        run: node music-core.test.mjs
      - name: Collect recent official music videos
        run: node collect-music.mjs
      - name: Publish music catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add music-catalog.json music-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh ELSEWHERE music catalog'
            git pull --rebase origin main
            git push
          fi
