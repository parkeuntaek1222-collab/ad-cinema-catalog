name: Refresh global ads
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: catalog-refresh
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Discover official channel candidates
        run: node discover.mjs
      - name: Refresh views and select recent ads
        run: node collect.mjs
      - name: Save updated catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources.json catalog.json collection-status.json discovery-candidates.json discovery-state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh global advertising catalog'
            git push
          fi
